name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: pnpmを準備
        run: corepack enable
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: 型を検査
        run: pnpm typecheck
      - name: lintを実行
        run: pnpm lint
      - name: formatを検査
        run: pnpm format:check
      - name: testを実行
        run: pnpm test
      - name: golden evalを実行
        run: pnpm eval:golden
      - name: CLIをビルド
        run: pnpm build
      - name: workflow用CLIをビルド
        run: pnpm build:workflow-cli
      - name: Web UIをビルド
        run: pnpm build:web

  verify-state:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: v4 state branchの存在を確認
        id: state_branch
        shell: bash
        run: |
          set +e
          git ls-remote --exit-code --heads origin tracker-state-v4 >/dev/null
          state_branch_status=$?
          set -e
          if [[ "$state_branch_status" -eq 0 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [[ "$state_branch_status" -eq 2 ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            exit "$state_branch_status"
          fi
      - name: cache-only stateを取得
        if: steps.state_branch.outputs.exists == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: tracker-state-v4
          path: tracker-state-v4
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: pnpmを準備
        run: corepack enable
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: CLIをビルド
        run: pnpm build
      - name: cache-only stateを検証
        if: steps.state_branch.outputs.exists == 'true'
        run: pnpm tracker:run verify-state --state-directory tracker-state-v4/state
