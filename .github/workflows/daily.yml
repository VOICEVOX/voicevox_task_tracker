name: 日次タスク追跡

on:
  schedule:
    - cron: "0 3 * * *" # JSTでは12:00
    - cron: "0 7 * * *" # JSTでは16:00
    - cron: "0 11 * * *" # JSTでは20:00
    - cron: "0 15 * * *" # JSTでは翌日00:00
    - cron: "0 19 * * *" # JSTでは翌日04:00
    - cron: "0 23 * * *" # JSTでは翌日08:00
  workflow_dispatch:
    inputs:
      backfill:
        description: 追跡対象へ追加する範囲
        required: true
        default: none
        type: choice
        options:
          - none
          - linked
          - all-open
      repository_filter:
        description: backfill対象を限定するVOICEVOXリポジトリ名のカンマ区切り
        required: false
        type: string
      notification_action:
        description: 通知処理
        required: true
        default: send
        type: choice
        options:
          - send
          - hold
          - acknowledge-current

permissions: {}

concurrency:
  group: voicevox-task-tracker-daily
  cancel-in-progress: false

jobs:
  production-pages-lease:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'schedule' || vars.VOICEVOX_TASK_TRACKER_SCHEDULE_PAUSED != 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: sourceを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: production Pages leaseを確認
        run: bash .github/scripts/assert-production-pages-lease.sh
  tracking:
    needs: production-pages-lease
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/_tracking-run.yml
    with:
      state_ref: tracker-state
      pages_environment: github-pages
      effect_concurrency_key: voicevox-task-tracker-daily
      effect_target: production
      config_path: config.yml
      backfill: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill || 'none' }}
      repository_filter: ${{ inputs.repository_filter || '' }}
      notification_action: ${{ inputs.notification_action || 'send' }}
      schedule: ${{ github.event.schedule || '' }}
    secrets: inherit
