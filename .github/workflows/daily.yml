name: 日次タスク追跡

on:
  schedule:
    - cron: "0 3 * * *" # JSTでは12:00
    - cron: "0 7 * * *" # JSTでは16:00
    - cron: "0 11 * * *" # JSTでは20:00
    - cron: "0 15 * * *" # JSTでは翌日00:00
    - cron: "0 19 * * *" # JSTでは翌日04:00
    - cron: "0 23 * * *" # JSTでは翌日08:00
  workflow_dispatch:
    inputs:
      backfill:
        description: 追跡対象へ追加する範囲
        required: true
        default: none
        type: choice
        options:
          - none
          - linked
          - all-open
      repository_filter:
        description: backfill対象を限定するVOICEVOXリポジトリ名のカンマ区切り
        required: false
        type: string
      notification_action:
        description: 通知処理
        required: true
        default: send
        type: choice
        options:
          - send
          - dismiss-current

permissions: {}

concurrency:
  group: voicevox-task-tracker-daily
  cancel-in-progress: false

jobs:
  quality-eval:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: pnpmを準備
        run: corepack enable
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: 型を検査
        run: pnpm typecheck
      - name: lintを実行
        run: pnpm lint
      - name: formatを検査
        run: pnpm format:check
      - name: golden evalを実行
        run: pnpm eval:golden

  collect-analyze:
    needs: quality-eval
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 既存stateを取得
        run: |
          set +e
          git ls-remote --exit-code --heads origin tracker-state >/dev/null
          state_branch_status=$?
          set -e
          if [[ "$state_branch_status" -eq 0 ]]; then
            git fetch --no-tags origin refs/heads/tracker-state:refs/heads/tracker-state
          elif [[ "$state_branch_status" -ne 2 ]]; then
            exit "$state_branch_status"
          fi
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: pnpmを準備
        run: corepack enable
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: Codex CLIを確認
        run: pnpm exec codex --version
      - name: CLIをビルド
        run: pnpm build
      - name: 後続job用CLIをビルド
        run: pnpm build:workflow-cli
      - name: Codex認証ファイルを配置
        id: codex_auth_placement
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [[ -z "$CODEX_AUTH_JSON" ]]; then
            echo "CODEX_AUTH_JSONが空です" >&2
            exit 1
          fi
          mkdir -p "${{ runner.temp }}/codex-home"
          chmod 700 "${{ runner.temp }}/codex-home"
          printf '%s' "$CODEX_AUTH_JSON" > "${{ runner.temp }}/codex-home/auth.json"
          chmod 600 "${{ runner.temp }}/codex-home/auth.json"
          sha256sum "${{ runner.temp }}/codex-home/auth.json" > "${{ runner.temp }}/codex-auth-fingerprint"
          chmod 600 "${{ runner.temp }}/codex-auth-fingerprint"
          .github/scripts/mask-codex-auth-values.sh "${{ runner.temp }}/codex-home/auth.json"
      - name: 収集と解析を実行
        env:
          BACKFILL_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill || 'none' }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          GH_APP_ID: ${{ vars.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          NOTIFICATION_ACTION: ${{ inputs.notification_action || 'send' }}
          REPOSITORY_FILTER: ${{ inputs.repository_filter || '' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          current_time="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            case "$SCHEDULE" in
              "0 3 * * *") scheduled_time="03:00" ;;
              "0 7 * * *") scheduled_time="07:00" ;;
              "0 11 * * *") scheduled_time="11:00" ;;
              "0 15 * * *") scheduled_time="15:00" ;;
              "0 19 * * *") scheduled_time="19:00" ;;
              "0 23 * * *") scheduled_time="23:00" ;;
              *)
                echo "未知のschedule式です。対象: $SCHEDULE" >&2
                exit 1
                ;;
            esac
            scheduled_for="$(date -u --date="today $scheduled_time" +'%Y-%m-%dT%H:%M:%S.000Z')"
            if [[ "$scheduled_for" > "$current_time" ]]; then
              scheduled_for="$(date -u --date="yesterday $scheduled_time" +'%Y-%m-%dT%H:%M:%S.000Z')"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            scheduled_for="$current_time"
          else
            echo "未対応のworkflow eventです。対象: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          arguments=(collect-analyze --mode "$BACKFILL_MODE" --notification-action "$NOTIFICATION_ACTION" --scheduled-for "$scheduled_for")
          if [[ -n "$REPOSITORY_FILTER" ]]; then
            IFS=',' read -r -a repositories <<< "$REPOSITORY_FILTER"
            for repository in "${repositories[@]}"; do
              arguments+=(--repository "$repository")
            done
          fi
          pnpm tracker:run "${arguments[@]}"
      - name: 公開可能なrun artifactを保存
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-public-run
          path: artifacts/workflow
          if-no-files-found: error
          retention-days: 1
      - name: 収集run reportを保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-run-report-${{ github.run_id }}-${{ github.run_attempt }}-collect-analyze
          path: artifacts/run-reports/collect-analyze.json
          if-no-files-found: error
          retention-days: 30
      - name: 更新されたCodex認証ファイルをsecretへ書き戻す
        if: always() && steps.codex_auth_placement.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CODEX_AUTH_SYNC_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "CODEX_AUTH_SYNC_TOKENが空のためCodex認証ファイルをsecretへ書き戻せません" >&2
            exit 1
          fi
          .github/scripts/mask-codex-auth-values.sh "${{ runner.temp }}/codex-home/auth.json"
          if sha256sum --check --status "${{ runner.temp }}/codex-auth-fingerprint"; then
            echo "Codex認証ファイルは更新されていません"
            exit 0
          fi
          gh secret set CODEX_AUTH_JSON \
            --repo "$GITHUB_REPOSITORY" \
            < "${{ runner.temp }}/codex-home/auth.json"
      - name: Codex認証関連ファイルを削除
        if: always()
        run: |
          rm -rf "${{ runner.temp }}/codex-home"
          rm -f "${{ runner.temp }}/codex-auth-fingerprint"

  persist-state:
    needs: collect-analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: 既存stateを取得
        run: |
          set +e
          git ls-remote --exit-code --heads origin tracker-state >/dev/null
          state_branch_status=$?
          set -e
          if [[ "$state_branch_status" -eq 0 ]]; then
            git fetch --no-tags origin refs/heads/tracker-state:refs/heads/tracker-state
          elif [[ "$state_branch_status" -ne 2 ]]; then
            exit "$state_branch_status"
          fi
      - name: 公開可能なrun artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-public-run
          path: artifacts/workflow
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: stateをtracker-stateへ保存
        run: node --enable-source-maps artifacts/workflow/runtime/tracker-run.mjs persist-state
      - name: tracker-stateを更新
        run: git push origin refs/heads/tracker-state:refs/heads/tracker-state

  build-pages:
    needs: persist-state
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: 保存済みstateを取得
        run: |
          set +e
          git ls-remote --exit-code --heads origin tracker-state >/dev/null
          state_branch_status=$?
          set -e
          if [[ "$state_branch_status" -eq 0 ]]; then
            git fetch --no-tags origin refs/heads/tracker-state:refs/heads/tracker-state
          elif [[ "$state_branch_status" -ne 2 ]]; then
            exit "$state_branch_status"
          fi
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: pnpmを準備
        run: corepack enable
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: 公開可能なrun artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-public-run
          path: artifacts/workflow
      - name: Pages用データを生成
        run: node --enable-source-maps artifacts/workflow/runtime/tracker-run.mjs build-pages --output web/public/data
      - name: Pagesをビルド
        run: pnpm build:web
      - name: Pagesを構成
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Pages artifactを保存
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/web

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pagesへdeploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          timeout: 1200000

  notify-discord:
    needs:
      - collect-analyze
      - deploy-pages
    if: >-
      success() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: 既存stateを取得
        run: git fetch --no-tags origin refs/heads/tracker-state:refs/heads/tracker-state
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.11.1
      - name: 公開可能なrun artifactを取得
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: validated-public-run
          path: artifacts/workflow
      - name: Discordへ通知
        if: github.event_name != 'workflow_dispatch' || inputs.notification_action == 'send'
        env:
          DISCORD_OPERATIONS_WEBHOOK_URL: ${{ secrets.DISCORD_OPERATIONS_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGES_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: >-
          node --enable-source-maps artifacts/workflow/runtime/tracker-run.mjs notify-discord
          --pages-url "$PAGES_URL"
      - name: 通知候補を抑制
        if: github.event_name == 'workflow_dispatch' && inputs.notification_action == 'dismiss-current'
        env:
          PAGES_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: >-
          node --enable-source-maps artifacts/workflow/runtime/tracker-run.mjs notify-discord
          --pages-url "$PAGES_URL"
      - name: run完了stateを更新
        run: git push origin refs/heads/tracker-state:refs/heads/tracker-state

  notify-operations:
    needs:
      - collect-analyze
      - build-pages
      - deploy-pages
      - notify-discord
    if: >-
      always() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.collect-analyze.result == 'failure' ||
      needs.build-pages.result == 'failure' ||
      needs.deploy-pages.result == 'failure' ||
      needs.notify-discord.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: 既存stateを取得
        run: |
          set +e
          git ls-remote --exit-code --heads origin tracker-state >/dev/null
          state_branch_status=$?
          set -e
          if [[ "$state_branch_status" -eq 0 ]]; then
            git fetch --no-tags origin refs/heads/tracker-state:refs/heads/tracker-state
          elif [[ "$state_branch_status" -ne 2 ]]; then
            exit "$state_branch_status"
          fi
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: pnpmを準備
        run: corepack enable
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: CLIをビルド
        run: pnpm build
      - name: 運用障害をDiscordへ通知
        env:
          DISCORD_OPERATIONS_WEBHOOK_URL: ${{ secrets.DISCORD_OPERATIONS_WEBHOOK_URL }}
          INCIDENT_ID: ${{ github.run_id }}
          BUILD_PAGES_RESULT: ${{ needs.build-pages.result }}
          COLLECT_ANALYZE_RESULT: ${{ needs.collect-analyze.result }}
          DEPLOY_PAGES_RESULT: ${{ needs.deploy-pages.result }}
          NOTIFY_DISCORD_RESULT: ${{ needs.notify-discord.result }}
        run: |
          if [[ "$COLLECT_ANALYZE_RESULT" == "failure" ]]; then
            incident_kind=collection
          elif [[ "$BUILD_PAGES_RESULT" == "failure" || "$DEPLOY_PAGES_RESULT" == "failure" ]]; then
            incident_kind=pages
          elif [[ "$NOTIFY_DISCORD_RESULT" == "failure" ]]; then
            incident_kind=discord
          else
            echo "監視対象jobに失敗がありません" >&2
            exit 1
          fi
          occurred_at="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          pnpm tracker:run notify-operations \
            --kind "$incident_kind" \
            --incident-id "$INCIDENT_ID:$incident_kind" \
            --occurred-at "$occurred_at"
      - name: 通知ledgerを更新
        run: git push origin refs/heads/tracker-state:refs/heads/tracker-state

  report-workflow:
    needs:
      - quality-eval
      - collect-analyze
      - persist-state
      - build-pages
      - deploy-pages
      - notify-discord
      - notify-operations
    if: >-
      always() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Node.jsを準備
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: pnpmを準備
        run: corepack enable
      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile
      - name: CLIをビルド
        run: pnpm build
      - name: 収集run reportを取得
        if: needs.collect-analyze.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daily-run-report-${{ github.run_id }}-${{ github.run_attempt }}-collect-analyze
          path: artifacts/run-reports
      - name: workflow run reportを作成
        env:
          BUILD_PAGES_RESULT: ${{ needs.build-pages.result }}
          COLLECT_ANALYZE_RESULT: ${{ needs.collect-analyze.result }}
          DEPLOY_PAGES_RESULT: ${{ needs.deploy-pages.result }}
          NOTIFY_DISCORD_RESULT: ${{ needs.notify-discord.result }}
          NOTIFY_OPERATIONS_RESULT: ${{ needs.notify-operations.result }}
          PERSIST_STATE_RESULT: ${{ needs.persist-state.result }}
          QUALITY_EVAL_RESULT: ${{ needs.quality-eval.result }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: >-
          pnpm tracker:run report-workflow
          --run-id "$WORKFLOW_RUN_ID"
          --run-attempt "$WORKFLOW_RUN_ATTEMPT"
          --quality-eval-result "$QUALITY_EVAL_RESULT"
          --collect-analyze-result "$COLLECT_ANALYZE_RESULT"
          --persist-state-result "$PERSIST_STATE_RESULT"
          --build-pages-result "$BUILD_PAGES_RESULT"
          --deploy-pages-result "$DEPLOY_PAGES_RESULT"
          --notify-discord-result "$NOTIFY_DISCORD_RESULT"
          --notify-operations-result "$NOTIFY_OPERATIONS_RESULT"
      - name: workflow run reportを保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-run-report-${{ github.run_id }}-${{ github.run_attempt }}-workflow
          path: artifacts/run-reports/workflow.json
          if-no-files-found: error
          retention-days: 30
